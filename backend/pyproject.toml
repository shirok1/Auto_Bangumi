[project]
name = "AutoBangumi"
version = "0.1.0"
description = "Automated anime downloader and manager"
authors = [{name = "EstrellaXD"}]
requires-python = ">=3.10"
dependencies = [
    "anyio==3.7.0",
    "aria2p",
    "bcrypt==4.0.1",
    "bs4==0.0.1",
    "fastapi==0.97.0",
    "jinja2==3.1.2",
    "openai==0.28.1",
    "passlib==1.7.4",
    "pydantic~=1.10",
    "python-dotenv==1.0.0",
    "python-jose==3.3.0",
    "python-multipart==0.0.6",
    "qbittorrent-api==2023.9.53",
    "requests==2.31.0",
    "semver==3.0.1",
    "sqlmodel==0.0.8",
    "sse-starlette==1.6.5",
    "uvicorn==0.22.0",
]

[tool.ruff]
select = [
    # pycodestyle(E): https://beta.ruff.rs/docs/rules/#pycodestyle-e-w
    "E", 
    # Pyflakes(F): https://beta.ruff.rs/docs/rules/#pyflakes-f
    "F", 
    # isort(I): https://beta.ruff.rs/docs/rules/#isort-i
    "I"
]
ignore = [
    # E501: https://beta.ruff.rs/docs/rules/line-too-long/
    'E501', 
    # F401: https://beta.ruff.rs/docs/rules/unused-import/
    # avoid unused imports lint in `__init__.py`
    'F401',
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
per-file-ignores = {}

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
